name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Go Security Audit
        run: |
          go vet ./...
          go list -json -deps ./... | nancy sleuth
