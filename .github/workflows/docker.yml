name: Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nonprofit-app .

      - name: Save Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonprofit-app-image
          path: ./Dockerfile
