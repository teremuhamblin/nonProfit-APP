name: "CodeQL Advanced Optimized"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "27 14 * * 3"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Préparation environnement CodeQL (Node 24)
      - name: Force Node 24
        run: |
          echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      # Cache CodeQL pour accélérer les analyses
      - name: Cache CodeQL DB
        uses: actions/cache@v4
        with:
          path: ~/.codeql
          key: codeql-${{ matrix.language }}

      # Initialisation CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # Build manuel si nécessaire
      - name: Manual build
        if: matrix.build-mode == 'manual'
        run: |
          echo "Manual build mode detected"
          go mod tidy
          go build ./...

      # Analyse CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/security/${{ matrix.language }}"
          upload: true
